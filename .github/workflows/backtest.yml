# Backtest Aug-Oct 2025 on reanalysis weather -> docs/backtest/ (PNG + JSON), committed to the branch.
name: backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "pipeline/backtest*.py"
      - "pipeline/weather/**"
      - "pipeline/config/backtest.yaml"
      - "pipeline/config/model_params.yaml"
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

concurrency:
  group: climatology
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -q -r pipeline/requirements.txt
      - run: python -m pipeline.backtest
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtest data/climatology
          git commit -q -m "Backtest results" || { echo "No changes"; exit 0; }
          for i in 1 2 3; do git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; git pull -q --rebase origin "${GITHUB_REF_NAME}"; done
          exit 1
